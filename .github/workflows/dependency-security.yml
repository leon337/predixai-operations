name: Dependency Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: npm ci

      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- package-lock.json

      - name: Validate environment contract
        run: npm test

      - name: Record dependency tree
        run: npm ls sharp postcss --all > dependency-tree.txt

      - name: Generate audit report
        run: npm audit --json > npm-audit.json || true

      - name: Enforce high-severity security gate
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('Vulnerability counts:', counts);
          if ((counts.high ?? 0) > 0 || (counts.critical ?? 0) > 0) {
            process.exit(1);
          }
          NODE

      - name: Build production application
        run: npm run build

      - name: Run local health smoke
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3000 > next-health.log 2>&1 &
          app_pid=$!
          cleanup_app() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup_app EXIT
          npm run smoke:local

      - name: Generate release candidate evidence
        env:
          R6_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          R6_BUILD_RESULT: PASS
          R6_SMOKE_RESULT: PASS
        run: npm run release:evidence

      - name: Validate local Supabase reproducibility and recovery drill
        run: |
          set -euo pipefail
          cleanup() {
            node scripts/supabase-local.mjs stop || true
          }
          trap cleanup EXIT
          node scripts/supabase-local.mjs start
          node scripts/supabase-local.mjs status
          node scripts/supabase-local.mjs reset
          node scripts/supabase-local-recovery.mjs

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-evidence
          path: |
            package-lock.json
            npm-audit.json
            dependency-tree.txt
            next-health.log
            release-evidence/release-evidence.json
            r5-recovery-evidence/
          if-no-files-found: error
          retention-days: 14
